name: Build safe-rm

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      changed: ${{ steps.version.outputs.CHANGED }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            echo "CHANGED=false" >> $GITHUB_OUTPUT
          else
            echo "Tag v$VERSION not exists"
            echo "CHANGED=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-aarch64-gnu
            cross: true
          - target: loongarch64-unknown-linux-gnu
            os: ubuntu-24.04
            name: linux-loongarch64-gnu
            cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x86_64-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-aarch64-musl
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            name: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-aarch64
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            name: freebsd-x86_64
            cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compile tools (Linux ARM64)
        if: matrix.cross && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install LoongArch toolchain
        if: matrix.target == 'loongarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-14-loongarch64-linux-gnu \
            binutils-loongarch64-linux-gnu \
            libc6-dev-loong64-cross
          echo "CARGO_TARGET_LOONGARCH64_UNKNOWN_LINUX_GNU_LINKER=loongarch64-linux-gnu-gcc-14" >> $GITHUB_ENV

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
            echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi

      - name: Install cross (for FreeBSD)
        if: matrix.target == 'x86_64-unknown-freebsd'
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-freebsd" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Strip binary
        if: "!contains(matrix.target, 'freebsd')"
        run: |
          if [ "${{ matrix.target }}" = "loongarch64-unknown-linux-gnu" ]; then
            loongarch64-linux-gnu-strip target/${{ matrix.target }}/release/safe-rm || true
          else
            strip target/${{ matrix.target }}/release/safe-rm || true
          fi

      - name: Package
        run: |
          BIN=target/${{ matrix.target }}/release/safe-rm
          VERSION=${{ needs.check-version.outputs.version }}
          PKG=safe-rm-v${VERSION}-${{ matrix.name }}

          # SYSCONFDIR by platform
          case "${{ matrix.name }}" in
              linux-*)              SYSCONFDIR="/etc" ;;
              freebsd-*|macos-*)    SYSCONFDIR="/usr/local/etc" ;;
              *)                    SYSCONFDIR="/etc" ;;
          esac

          echo "SYSCONFDIR=$SYSCONFDIR"

          mkdir -p $PKG
          cp $BIN $PKG/safe-rm

          # Upstream docs
          cp README.md $PKG/ 2>/dev/null || true
          cp INSTALL $PKG/ 2>/dev/null || true
          cp install.sh $PKG/ 2>/dev/null || true
          cp COPYING $PKG/ 2>/dev/null || true
          cp Changes $PKG/ 2>/dev/null || true
          cp safe-rm.1 $PKG/ 2>/dev/null || true

          # Default protection list
          cat > $PKG/safe-rm.conf << 'CONF'
          /
          /bin
          /boot
          /dev
          /etc
          /home
          /lib
          /lib32
          /lib64
          /media
          /mnt
          /opt
          /proc
          /root
          /sbin
          /srv
          /sys
          /tmp
          /usr
          /var
          CONF

          # PATH setup script
          cat > $PKG/safe-rm.sh << 'SH'
          #!/bin/sh
          # Ensure that safe-rm takes precedence over the real `rm` command
          PATH="/usr/local/share/safe-rm/bin:$PATH"
          export PATH
          SH
          chmod +x $PKG/safe-rm.sh

          # Symlink directory
          mkdir -p $PKG/bin
          ln -sf /usr/local/bin/safe-rm $PKG/bin/rm

          # Update script: expand $SYSCONFDIR at package time
          cat > $PKG/update-safe-rm << UPD
          #!/bin/sh
          # Update safe-rm protection list
          # 更新 safe-rm 保护列表

          CONF="\${1:-$SYSCONFDIR/safe-rm.conf}"

          case "\${LANG%%.*}" in
              zh_CN|zh_SG) MSG_UPDATED="已更新"; MSG_COUNT="条"; MSG_SEP="，共" ;;
              zh_TW|zh_HK) MSG_UPDATED="已更新"; MSG_COUNT="條"; MSG_SEP="，共" ;;
              ja_JP)       MSG_UPDATED="更新しました"; MSG_COUNT="件"; MSG_SEP="、" ;;
              ko_KR)       MSG_UPDATED="업데이트됨"; MSG_COUNT="개"; MSG_SEP="," ;;
              vi_VN)       MSG_UPDATED="Đã cập nhật"; MSG_COUNT="mục"; MSG_SEP="," ;;
              th_TH)       MSG_UPDATED="อัปเดตแล้ว"; MSG_COUNT="รายการ"; MSG_SEP="," ;;
              id_ID)       MSG_UPDATED="Diperbarui"; MSG_COUNT="entri"; MSG_SEP="," ;;
              ms_MY)       MSG_UPDATED="Dikemas kini"; MSG_COUNT="entri"; MSG_SEP="," ;;
              hi_IN)       MSG_UPDATED="अद्यतन किया गया"; MSG_COUNT="प्रविष्टियाँ"; MSG_SEP="," ;;
              bn_BD)       MSG_UPDATED="আপডেট করা হয়েছে"; MSG_COUNT="এন্ট্রি"; MSG_SEP="," ;;
              tr_TR)       MSG_UPDATED="Güncellendi"; MSG_COUNT="girdi"; MSG_SEP="," ;;
              ru_RU)       MSG_UPDATED="Обновлено"; MSG_COUNT="записей"; MSG_SEP="," ;;
              uk_UA)       MSG_UPDATED="Оновлено"; MSG_COUNT="записів"; MSG_SEP="," ;;
              pl_PL)       MSG_UPDATED="Zaktualizowano"; MSG_COUNT="wpisów"; MSG_SEP="," ;;
              cs_CZ)       MSG_UPDATED="Aktualizováno"; MSG_COUNT="záznamů"; MSG_SEP="," ;;
              sk_SK)       MSG_UPDATED="Aktualizované"; MSG_COUNT="záznamov"; MSG_SEP="," ;;
              hu_HU)       MSG_UPDATED="Frissítve"; MSG_COUNT="bejegyzés"; MSG_SEP="," ;;
              ro_RO)       MSG_UPDATED="Actualizat"; MSG_COUNT="intrări"; MSG_SEP="," ;;
              el_GR)       MSG_UPDATED="Ενημερώθηκε"; MSG_COUNT="καταχωρήσεις"; MSG_SEP="," ;;
              de_DE)       MSG_UPDATED="Aktualisiert"; MSG_COUNT="Einträge"; MSG_SEP="," ;;
              fr_FR|fr_CA|fr_BE|fr_CH) MSG_UPDATED="Mis à jour"; MSG_COUNT="entrées"; MSG_SEP="," ;;
              es_ES|es_MX|es_AR|es_CO|es_CL|es_PE) MSG_UPDATED="Actualizado"; MSG_COUNT="entradas"; MSG_SEP="," ;;
              pt_PT|pt_BR) MSG_UPDATED="Atualizado"; MSG_COUNT="entradas"; MSG_SEP="," ;;
              it_IT)       MSG_UPDATED="Aggiornato"; MSG_COUNT="voci"; MSG_SEP="," ;;
              nl_NL)       MSG_UPDATED="Bijgewerkt"; MSG_COUNT="vermeldingen"; MSG_SEP="," ;;
              sv_SE)       MSG_UPDATED="Uppdaterad"; MSG_COUNT="poster"; MSG_SEP="," ;;
              nb_NO|nn_NO) MSG_UPDATED="Oppdatert"; MSG_COUNT="oppføringer"; MSG_SEP="," ;;
              da_DK)       MSG_UPDATED="Opdateret"; MSG_COUNT="poster"; MSG_SEP="," ;;
              fi_FI)       MSG_UPDATED="Päivitetty"; MSG_COUNT="merkintää"; MSG_SEP="," ;;
              ar_SA|ar_EG|ar_AE|ar_MA|ar_DZ) MSG_UPDATED="تم التحديث"; MSG_COUNT="إدخالات"; MSG_SEP="،" ;;
              he_IL)       MSG_UPDATED="עודכן"; MSG_COUNT="רשומות"; MSG_SEP="," ;;
              fa_IR)       MSG_UPDATED="به‌روزرسانی شد"; MSG_COUNT="ورودی"; MSG_SEP="،" ;;
              af_ZA)       MSG_UPDATED="Opgedateer"; MSG_COUNT="inskrywings"; MSG_SEP="," ;;
              am_ET)       MSG_UPDATED="ተዘምኗል"; MSG_COUNT="ግቤቶች"; MSG_SEP="," ;;
              az_AZ)       MSG_UPDATED="Yeniləndi"; MSG_COUNT="qeydlər"; MSG_SEP="," ;;
              be_BY)       MSG_UPDATED="Абноўлена"; MSG_COUNT="запісаў"; MSG_SEP="," ;;
              bg_BG)       MSG_UPDATED="Актуализирано"; MSG_COUNT="записа"; MSG_SEP="," ;;
              ca_ES)       MSG_UPDATED="Actualitzat"; MSG_COUNT="entrades"; MSG_SEP="," ;;
              et_EE)       MSG_UPDATED="Uuendatud"; MSG_COUNT="kirjet"; MSG_SEP="," ;;
              gu_IN)       MSG_UPDATED="અપડેટ કર્યું"; MSG_COUNT="એન્ટ્રીઓ"; MSG_SEP="," ;;
              hr_HR)       MSG_UPDATED="Ažurirano"; MSG_COUNT="unosa"; MSG_SEP="," ;;
              hy_AM)       MSG_UPDATED="Թարմացվել է"; MSG_COUNT="գրառումներ"; MSG_SEP="," ;;
              is_IS)       MSG_UPDATED="Uppfært"; MSG_COUNT="færslur"; MSG_SEP="," ;;
              ka_GE)       MSG_UPDATED="განახლდა"; MSG_COUNT="ჩანაწერები"; MSG_SEP="," ;;
              kk_KZ)       MSG_UPDATED="Жаңартылды"; MSG_COUNT="жазбалар"; MSG_SEP="," ;;
              kn_IN)       MSG_UPDATED="ನವೀಕರಿಸಲಾಗಿದೆ"; MSG_COUNT="ನಮೂದುಗಳು"; MSG_SEP="," ;;
              lt_LT)       MSG_UPDATED="Atnaujinta"; MSG_COUNT="įrašų"; MSG_SEP="," ;;
              lv_LV)       MSG_UPDATED="Atjaunināts"; MSG_COUNT="ieraksti"; MSG_SEP="," ;;
              mk_MK)       MSG_UPDATED="Ажурирано"; MSG_COUNT="записи"; MSG_SEP="," ;;
              ml_IN)       MSG_UPDATED="അപ്ഡേറ്റ് ചെയ്തു"; MSG_COUNT="എൻട്രികൾ"; MSG_SEP="," ;;
              mn_MN)       MSG_UPDATED="Шинэчлэгдсэн"; MSG_COUNT="бичлэг"; MSG_SEP="," ;;
              mr_IN)       MSG_UPDATED="अद्ययावत केले"; MSG_COUNT="नोंदी"; MSG_SEP="," ;;
              ne_NP)       MSG_UPDATED="अद्यावधिक गरियो"; MSG_COUNT="प्रविष्टिहरू"; MSG_SEP="," ;;
              pa_IN)       MSG_UPDATED="ਅੱਪਡੇਟ ਕੀਤਾ"; MSG_COUNT="ਇੰਦਰਾਜਾਂ"; MSG_SEP="," ;;
              si_LK)       MSG_UPDATED="යාවත්කාලීන කරන ලදි"; MSG_COUNT="සටහන්"; MSG_SEP="," ;;
              sl_SI)       MSG_UPDATED="Posodobljeno"; MSG_COUNT="vnosov"; MSG_SEP="," ;;
              sq_AL)       MSG_UPDATED="Përditësuar"; MSG_COUNT="hyrje"; MSG_SEP="," ;;
              sr_RS)       MSG_UPDATED="Ажурирано"; MSG_COUNT="уноса"; MSG_SEP="," ;;
              sw_KE)       MSG_UPDATED="Imesasishwa"; MSG_COUNT="maingizo"; MSG_SEP="," ;;
              ta_IN)       MSG_UPDATED="புதுப்பிக்கப்பட்டது"; MSG_COUNT="பதிவுகள்"; MSG_SEP="," ;;
              te_IN)       MSG_UPDATED="నవీకరించబడింది"; MSG_COUNT="నమోదులు"; MSG_SEP="," ;;
              ur_PK)       MSG_UPDATED="اپ ڈیٹ ہو گیا"; MSG_COUNT="اندراجات"; MSG_SEP="," ;;
              uz_UZ)       MSG_UPDATED="Yangilandi"; MSG_COUNT="yozuvlar"; MSG_SEP="," ;;
              *)           MSG_UPDATED="Updated"; MSG_COUNT="entries"; MSG_SEP="," ;;
          esac

          {
              echo "/"
              for item in /*; do
                  echo "\$item"
              done
          } | sort -u > "\$CONF"

          COUNT=\$(wc -l < "\$CONF" | tr -d ' ')
          echo "\$MSG_UPDATED \$CONF\$MSG_SEP \$COUNT \$MSG_COUNT"
          UPD
          chmod +x $PKG/update-safe-rm

          tar czf $PKG.tar.gz $PKG

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: safe-rm-${{ matrix.name }}
          path: safe-rm-*.tar.gz

  release:
    name: Release
    needs: [check-version, build]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create tag
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract commit message (Generate Release Note)
        id: msg
        run: |
          {
            echo "BODY<<RELEASE_BODY_EOF"
            echo "## Release Logs"
            echo ""
            git log -1 --format=%B
            echo ""
            echo "## Package Recommendations"
            echo ""
            echo "### Supported Platforms / 支持平台"
            echo ""
            echo "| Platform | Package | Architecture |"
            echo "|----------|---------|--------------|"
            echo "| Linux (glibc) | \`safe-rm-v${{ needs.check-version.outputs.version }}-linux-x86_64-gnu.tar.gz\` | x86_64 |"
            echo "| Linux (glibc) | \`safe-rm-v${{ needs.check-version.outputs.version }}-linux-aarch64-gnu.tar.gz\` | aarch64 / ARM64 |"
            echo "| Linux (glibc) | \`safe-rm-v${{ needs.check-version.outputs.version }}-linux-loongarch64-gnu.tar.gz\` | LoongArch64 / 龙芯 |"
            echo "| Linux (musl) | \`safe-rm-v${{ needs.check-version.outputs.version }}-linux-x86_64-musl.tar.gz\` | x86_64 |"
            echo "| Linux (musl) | \`safe-rm-v${{ needs.check-version.outputs.version }}-linux-aarch64-musl.tar.gz\` | aarch64 / ARM64 |"
            echo "| macOS | \`safe-rm-v${{ needs.check-version.outputs.version }}-macos-x86_64.tar.gz\` | Intel |"
            echo "| macOS | \`safe-rm-v${{ needs.check-version.outputs.version }}-macos-aarch64.tar.gz\` | Apple Silicon (M1/M2/M3) |"
            echo "| FreeBSD | \`safe-rm-v${{ needs.check-version.outputs.version }}-freebsd-x86_64.tar.gz\` | x86_64 |"
            echo ""
            echo "### Package Notes / 包说明"
            echo ""
            echo "**Linux glibc** (\`*-gnu.tar.gz\`)"
            echo "- For Debian, Ubuntu, RHEL, CentOS, Rocky, AlmaLinux, Fedora"
            echo "- 适用于 Debian、Ubuntu、RHEL、CentOS、Rocky、AlmaLinux、Fedora"
            echo "- Depends on system glibc"
            echo "- 依赖系统 glibc"
            echo ""
            echo "**Linux LoongArch** (\`*-loongarch64-gnu.tar.gz\`)"
            echo "- For Loongson 3A5000/3A6000, and other LoongArch64 systems"
            echo "- 适用于龙芯 3A5000/3A6000 及其他 LoongArch64 系统"
            echo ""
            echo "**Linux musl** (\`*-musl.tar.gz\`)"
            echo "- Static build, no glibc dependency"
            echo "- 静态编译，无 glibc 依赖"
            echo "- For Alpine, or any Linux that lacks matching glibc"
            echo "- 适用于 Alpine，或缺少匹配 glibc 的 Linux"
            echo "- Recommended for maximum portability"
            echo "- 推荐用于最大兼容性"
            echo ""
            echo "**macOS** (\`*-macos-*.tar.gz\`)"
            echo "- \`x86_64\` for Intel Mac"
            echo "- \`x86_64\` 适用于 Intel Mac"
            echo "- \`aarch64\` for Apple Silicon (M1/M2/M3)"
            echo "- \`aarch64\` 适用于 Apple Silicon (M1/M2/M3)"
            echo ""
            echo "**FreeBSD** (\`*-freebsd-x86_64.tar.gz\`)"
            echo "- For FreeBSD 14.x"
            echo "- 适用于 FreeBSD 14.x"
            echo ""
            echo "### Installation / 安装"
            echo ""
            echo "Each package contains:"
            echo "每个包包含："
            echo ""
            echo "- \`safe-rm\` — binary / 二进制"
            echo "- \`safe-rm.conf\` — default protection list / 默认保护列表"
            echo "- \`safe-rm.sh\` — PATH setup script / PATH 设置脚本"
            echo "- \`update-safe-rm\` — protection list updater / 保护列表更新脚本"
            echo "- \`bin/rm\` — symlink to safe-rm / 指向 safe-rm 的软链"
            echo "- \`install.sh\` — installer / 安装脚本"
            echo "- \`safe-rm.1\` — man page / 手册"
            echo "- \`README.md\`, \`INSTALL\`, \`COPYING\`, \`Changes\` — docs / 文档"
            echo ""
            echo "Quick install / 快速安装:"
            echo ""
            echo "\`\`\`bash"
            echo "curl -fsSL https://raw.githubusercontent.com/hestiacn/safe-rm/master/install.sh | sudo sh"
            echo "\`\`\`"
            echo ""
            echo "**Full commit:** \`$(git rev-parse HEAD)\`"
            echo "RELEASE_BODY_EOF"
          } >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: safe-rm v${{ needs.check-version.outputs.version }}
          body: ${{ steps.msg.outputs.BODY }}
          files: artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}